[project]
name = "revolab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "librosa>=0.11.0",
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "pesq>=0.0.4",
    "pystoi>=0.3.3",
    "torch>=2.3.0",
    "transformers>=4.40.0",
    "bert-score>=0.3.13",
    "sacrebleu>=2.4.0",
    "jiwer>=3.0.3",
    "snac",
    "tqdm",
]

[tool.setuptools.packages.find]
include = ["revolab*"]
exclude = ["test_data*"]